plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.4.2'
    id 'com.azuredoom.hytale-tools' version '1.0.38'
}

repositories {
    mavenCentral()
    gradlePluginPortal()
    maven { url "https://www.cursemaven.com" }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of((project.java_version as String).toInteger())
    }
    withSourcesJar()
    withJavadocJar()
}

base {
    archivesName = 'Hexcode'
}

configurations {
    shadowBundle
    implementation.extendsFrom(shadowBundle)
    testCompileOnly.extendsFrom(compileOnly)
    testRuntimeOnly.extendsFrom(compileOnly)
}

dependencies {
    compileOnly libs.jetbrains.annotations
    compileOnly libs.jspecify
    shadowBundle(files('lib/Patchly-3.4.0.jar'))
    // shadowBundle('curse.maven:patchly-1550889:8282627')
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.3'
}

hytaleTools {
    javaVersion = project.java_version as Integer
    hytaleVersion = project.hytale_version.toString()
    manifestServerVersion = project.manifestServerVersion.toString()
    manifestGroup = project.manifest_group.toString()
    modId = project.mod_id.toString()
    modDescription = project.mod_description.toString()
    modUrl = project.mod_url.toString()
    mainClass = project.main_class.toString()
    modCredits = project.mod_credits.toString()
    manifestDependencies = project.manifest_dependencies.toString()
    manifestOptionalDependencies = project.manifest_opt_dependencies.toString()
    curseforgeId = project.curseforgeID.toString()
    disabledByDefault = project.disabled_by_default.toString().toBoolean()
    includesPack = project.includes_pack.toString().toBoolean()
    patchline = project.patchline.toString()

    debugEnabled = true
    debugSuspend = false

    requireDcevm = true

    // The bonus extras
    subPlugin("Hextras", "com.riprod.hexcode.builtin.hextras.HextrasPlugin", false, false)
    // The survival plugin
    subPlugin("Hextreme", "com.riprod.hexcode.builtin.hextreme.HextremePlugin", false, false)
    // Imbuements / Block Imbuements / Item Imbuements
    subPlugin("Imbued", "com.riprod.hexcode.builtin.imbued.ImbuedPlugin", false, false)
    // The base hexcode glyphs + styles + assets
    subPlugin("HexCore", "com.riprod.hexcode.builtin.hexCore.HexCorePlugin", false, false)
    // The ritual-casting plugin
    subPlugin("Ritualistic", "com.riprod.hexcode.builtin.ritualistic.RitualisticPlugin", true, false)
    // The ultimate compatibility pack between hexcode and every-other plugin in existence
    subPlugin("Hexability", "com.riprod.hexcode.builtin.hexability.HexabilityPlugin", true, false)
    // The ultimate compatibility pack between hexcode and every-other plugin in existence
    subPlugin("Hexomation", "com.riprod.hexcode.builtin.hexomation.HexomationPlugin", true, false)
    // The debug code
    subPlugin("Counterspell", "com.riprod.hexcode.builtin.counterspell.CounterspellPlugin", true, false)
} 

shadowJar {
    archiveClassifier.set('')
    mergeServiceFiles()
    configurations = [project.configurations.shadowBundle]
    relocate('com.riprod.patchly', 'com.riprod.hexcode.shaded.patchly')
}

tasks.build {
    dependsOn("shadowJar")
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}